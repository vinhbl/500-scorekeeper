<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>500</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0E1A2B">
<meta name="description" content="Bid table and score sheet for the card game 500.">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="500">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1A2B;
    --ink-2:#17273D;
    --bone:#EFE9DC;
    --bone-2:#E2DACA;
    --red:#B93B2E;
    --black:#1B2A44;
    --gold:#B8912F;
    --plum:#6F5497;
    --line:rgba(14,26,43,.16);
    --line-lt:rgba(239,233,220,.18);
    --disp:'Bodoni Moda',Georgia,'Times New Roman',serif;
    --ui:'Archivo',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{background:var(--ink);-webkit-text-size-adjust:100%}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:var(--ui);
    -webkit-font-smoothing:antialiased;
    padding:0 0 calc(56px + var(--safe-b));
    overscroll-behavior-y:none;
  }
  button,input{font-family:inherit;touch-action:manipulation}
  button{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  .wrap{max-width:660px;margin:0 auto;padding:0 calc(16px + var(--safe-l)) 0 calc(16px + var(--safe-r))}

  /* ---------- masthead ---------- */
  .mast{
    position:relative;
    padding:calc(22px + var(--safe-t)) 0 22px;
    border-bottom:1px solid var(--line-lt);
    overflow:hidden;
  }
  .mast::before{
    content:"";position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(45deg,rgba(239,233,220,.05) 0 1px,transparent 1px 11px),
      repeating-linear-gradient(-45deg,rgba(239,233,220,.05) 0 1px,transparent 1px 11px);
    pointer-events:none;
  }
  .mast .wrap{position:relative}
  .mast-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .logo{font-family:var(--disp);font-size:44px;line-height:.9;letter-spacing:-.02em}
  .logo em{font-style:italic;font-weight:400}
  .kicker{
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(239,233,220,.55);font-weight:600;
  }

  /* ---------- scoreboard ---------- */
  .board{display:grid;gap:10px;margin:18px 0 6px}
  .side{
    background:var(--bone);color:var(--ink);
    border-radius:3px;padding:12px 14px;
    display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;
  }
  .side.lead{box-shadow:inset 0 0 0 2px var(--gold)}
  .side-name{
    font-weight:600;font-size:16px;border:0;background:transparent;
    color:var(--ink);width:100%;padding:2px 0;
    border-bottom:1px dashed transparent;border-radius:0;
  }
  .side-name:hover{border-bottom-color:var(--line)}
  .side-name:focus{outline:2px solid var(--gold);outline-offset:2px}
  .side-total{font-family:var(--disp);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
  .side-total.neg{color:var(--red)}
  .track{grid-column:1/-1;height:3px;background:var(--bone-2);position:relative;border-radius:2px}
  .track span{position:absolute;top:0;bottom:0;left:0;background:var(--ink);border-radius:2px}
  .track span.neg{background:var(--red)}
  .meta{grid-column:1/-1;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:rgba(14,26,43,.5)}

  .banner{
    margin:12px 0 0;padding:12px 14px;border-radius:3px;
    background:var(--gold);color:var(--ink);font-weight:700;font-size:14px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .banner.out{background:var(--red);color:var(--bone)}

  /* ---------- section headings ---------- */
  .head{display:flex;align-items:center;gap:12px;margin:30px 0 12px}
  .head h2{font-family:var(--disp);font-weight:400;font-size:20px;margin:0;letter-spacing:.01em}
  .head .rule{flex:1;height:1px;background:var(--line-lt)}
  .head .note{font-family:var(--mono);font-size:10px;color:rgba(239,233,220,.45);letter-spacing:.06em}

  /* ---------- bid table ---------- */
  .sheet{background:var(--bone);color:var(--ink);border-radius:3px;padding:12px;overflow:hidden}
  table.bids{width:100%;border-collapse:collapse;table-layout:fixed}
  table.bids th{
    font-family:var(--ui);font-size:11px;font-weight:700;padding:4px 0 8px;
    letter-spacing:.1em;text-transform:uppercase;color:rgba(14,26,43,.45);
  }
  table.bids th.suit{font-size:19px;letter-spacing:0}
  th.s-spades,th.s-clubs{color:var(--black)}
  th.s-diamonds,th.s-hearts{color:var(--red)}
  th.s-notrump{color:var(--gold);font-size:11px}
  table.bids td{padding:2px}
  td.lvl{font-family:var(--disp);font-size:19px;text-align:center;color:rgba(14,26,43,.75);width:34px}
  .cell{
    width:100%;border:1px solid var(--line);background:transparent;border-radius:2px;
    font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink);
    padding:11px 0;cursor:pointer;transition:background .12s,color .12s,transform .12s;
    font-variant-numeric:tabular-nums;
  }
  .cell:hover{background:rgba(14,26,43,.07)}
  .cell:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .cell[aria-pressed="true"]{color:var(--bone);border-color:transparent;transform:translateY(-1px)}
  /* outbid — still legible as a reference, clearly not a choice */
  .cell.dead{
    opacity:.26;text-decoration:line-through;text-decoration-thickness:1px;
    cursor:not-allowed;
  }
  .cell.dead:hover{background:transparent}
  .cell.c-spades[aria-pressed="true"],.cell.c-clubs[aria-pressed="true"]{background:var(--black)}
  .cell.c-diamonds[aria-pressed="true"],.cell.c-hearts[aria-pressed="true"]{background:var(--red)}
  .cell.c-notrump[aria-pressed="true"]{background:var(--gold);color:var(--ink)}

  .specials{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  .cell.c-misere[aria-pressed="true"]{background:var(--plum)}
  .cell.spec{padding:13px 0;font-family:var(--ui);font-weight:600;font-size:12px;letter-spacing:.04em}
  .cell.spec b{font-family:var(--mono);font-weight:500;opacity:.6;margin-left:6px}

  /* ---------- record hand ---------- */
  .panel{background:var(--ink-2);border:1px solid var(--line-lt);border-radius:3px;padding:14px}
  .panel.idle{opacity:.5}
  .contract-line{font-family:var(--disp);font-size:24px;margin:0 0 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .contract-line .val{font-family:var(--mono);font-size:13px;color:var(--gold);letter-spacing:.06em}
  .field{margin-bottom:14px}
  .label{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(239,233,220,.5);display:block;margin-bottom:7px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    background:transparent;color:var(--bone);border:1px solid var(--line-lt);
    border-radius:2px;padding:11px 14px;font-size:13px;font-weight:500;
    cursor:pointer;transition:background .12s,color .12s;
  }
  .chip:hover{background:rgba(239,233,220,.08)}
  .chip:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .chip[aria-pressed="true"]{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:600}
  .chip.num{font-family:var(--mono);min-width:42px;padding:11px 0;text-align:center;flex:1}
  .tally{font-family:var(--mono);font-size:11px;color:rgba(239,233,220,.45);margin-top:8px}
  .tally.bad{color:var(--gold)}
  .submit{
    width:100%;padding:16px;border:0;border-radius:2px;background:var(--gold);color:var(--ink);
    font-weight:700;font-size:14px;letter-spacing:.04em;cursor:pointer;
  }
  .submit:disabled{background:rgba(239,233,220,.14);color:rgba(239,233,220,.35);cursor:not-allowed}
  .submit:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
  .preview{font-family:var(--mono);font-size:11px;text-align:center;margin-top:9px;color:rgba(239,233,220,.6)}

  /* ---------- log ---------- */
  .log{background:var(--bone);color:var(--ink);border-radius:3px;overflow:hidden}
  .log-row{
    display:grid;grid-template-columns:26px 1fr auto auto;gap:10px;align-items:center;
    padding:11px 13px;border-bottom:1px solid var(--line);
  }
  .log-row:last-child{border-bottom:0}
  .log-row .n{font-family:var(--mono);font-size:11px;color:rgba(14,26,43,.4)}
  .log-row .what{font-size:13px;line-height:1.35}
  .log-row .what b{font-weight:600}
  .log-row .what span{color:rgba(14,26,43,.55);display:block;font-size:11px;font-family:var(--mono)}
  .log-row .delta{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
  .log-row .delta i{font-style:normal;display:block}
  .log-row .delta .up{color:#1E6B4F}
  .log-row .delta .dn{color:var(--red)}
  .undo{
    background:transparent;border:1px solid var(--line);border-radius:2px;color:rgba(14,26,43,.6);
    font-size:11px;padding:7px 10px;cursor:pointer;
  }
  .undo:hover{background:rgba(14,26,43,.07)}
  .empty{padding:22px 14px;font-size:13px;color:rgba(14,26,43,.55);line-height:1.5}
  .empty b{color:var(--ink)}

  /* ---------- rules ---------- */
  details.rules{border-top:1px solid var(--line-lt);margin-top:30px;padding-top:14px}
  details.rules summary{
    cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:rgba(239,233,220,.5);list-style:none;padding:4px 0;
  }
  details.rules summary::-webkit-details-marker{display:none}
  details.rules summary::before{content:"+ "}
  details.rules[open] summary::before{content:"\2013 "}
  .rule-item{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line-lt)}
  .rule-item:last-of-type{border-bottom:0}
  .rule-item input{margin-top:3px;accent-color:var(--gold);width:19px;height:19px;flex:none}
  .rule-item div{font-size:13px;line-height:1.4}
  .rule-item small{display:block;color:rgba(239,233,220,.45);font-size:11px;margin-top:3px}
  .danger{
    background:transparent;border:1px solid var(--red);color:var(--red);border-radius:2px;
    padding:11px 15px;font-size:12px;font-weight:600;cursor:pointer;margin-top:14px;
  }
  .danger:hover{background:var(--red);color:var(--bone)}
  .seat-toggle{display:flex;gap:6px;margin-top:10px}
  .colophon{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:rgba(239,233,220,.28);margin-top:26px;text-align:center}

  @media (max-width:420px){
    .logo{font-size:36px}
    .cell{font-size:12.5px;padding:10px 0}
    td.lvl{font-size:16px;width:26px}
    .side-total{font-size:30px}
  }


  /* ===================== round reference =====================
     Always present. Shows the standing bid and how trump reorders the deck.
     Needs only the contract, so it costs the user no extra input. */
  .panel.ref{padding:0;overflow:hidden}
  .ref-band{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:12px 14px;border-bottom:1px solid var(--line);
  }
  .ref-band .contract{display:flex;align-items:baseline;gap:7px;line-height:1}
  .ref-band .contract .lv{font-family:var(--disp);font-size:32px;line-height:.9}
  .ref-band .contract .st{font-size:29px;line-height:.9}
  .ref-band .contract .st.c-red{color:var(--red)}
  .ref-band .contract .st.c-blk{color:var(--black)}
  .ref-band .contract .st.c-nt{font-family:var(--disp);font-size:21px;color:var(--gold)}
  .ref-band .contract .st.c-mis{font-family:var(--disp);font-size:18px;color:var(--plum);font-style:italic}
  .ref-pts{
    font-family:var(--mono);font-size:24px;font-weight:600;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px;
  }
  .ref-pts span{
    font-family:var(--ui);font-size:9px;font-weight:800;letter-spacing:.14em;
    color:rgba(14,26,43,.42);
  }

  /* ---- the ladder itself ---- */
  .ranks{padding:12px 14px 13px}
  .ranks .rk-head{
    font-size:9px;letter-spacing:.08em;text-transform:uppercase;
    color:rgba(14,26,43,.42);font-weight:700;margin-bottom:8px;
  }
  .cards{display:flex;gap:4px;flex-wrap:wrap;align-items:start}
  .rcard{
    width:32px;border:1px solid var(--line);border-radius:2px;background:rgba(255,255,255,.45);
    display:grid;grid-template-rows:13px 15px;align-items:center;justify-items:center;padding:5px 1px;
  }
  .rcard .r{
    font-family:var(--mono);font-size:11px;font-weight:600;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .rcard .r.sm{font-size:9.5px;letter-spacing:.02em}
  .rcard .s{font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
  .rcard .s.c-red{color:var(--red);font-size:12.5px}
  .rcard .s.c-blk{color:var(--black)}
  .rcard.jk-card{background:var(--gold);border-color:var(--gold)}
  .rcard.jk-card .r,.rcard.jk-card .s{color:var(--ink)}
  .rcard.bower{box-shadow:inset 0 0 0 1.5px var(--gold)}
  .rcard.tail{background:transparent;border-style:dashed;width:auto;padding:5px 8px}
  .rcard.tail .r{
    grid-row:2;font-size:9.5px;letter-spacing:.09em;color:rgba(14,26,43,.45);font-weight:500;
  }
  /* the joker mark is an inline svg — without an explicit box it renders at
     its intrinsic size, which is enormous */
  .jk{width:15px;height:15px;display:block}
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:0 1px;place-items:center;line-height:1}
  .quad span{font-size:6.5px;line-height:1.05}
  .quad .c-red{color:var(--red);font-size:7px}
  .quad .c-blk{color:var(--black)}
  .rk-note{
    font-size:10px;color:rgba(14,26,43,.55);margin-top:9px;line-height:1.4;
    padding-top:8px;border-top:1px solid var(--line);
  }
  .rk-note b{color:var(--ink);font-weight:700}

  /* ---------- landscape: full-screen bid table for the table ----------
     Phone landscape only. Guarded by max-height + coarse pointer so desktop
     and tablet portrait keep the normal column layout. The use case is a
     shared reference: rotate, set the phone down, everyone reads the bids.
     Tapping still selects a contract, which carries back to portrait. */
  @media (orientation:landscape) and (max-height:600px) and (pointer:coarse){
    body{padding:0;overflow:hidden}

    .mast,#board,#banner,.head,#record,#reference,#log,details.rules,.colophon{display:none!important}
    main.wrap{
      max-width:none;margin:0;height:100vh;height:100dvh;
      padding:calc(7px + var(--safe-t)) calc(7px + var(--safe-r)) calc(7px + var(--safe-b)) calc(7px + var(--safe-l));
      display:flex;
    }
    .sheet{
      flex:1;margin:0;border-radius:4px;padding:9px 11px;
      display:flex;flex-direction:column;min-height:0;
    }
    /* flex:1 fills the leftover height; min-height:0 lets it shrink so
       .specials (flex:none) keeps its own row instead of being pushed past
       .sheet's overflow:hidden. Do NOT reintroduce height:100% here. */
    table.bids{flex:1;min-height:0}
    table.bids th{padding:1px 0 6px}
    table.bids th.suit{font-size:27px}
    th.s-notrump{font-size:15px;letter-spacing:.04em}
    td.lvl{font-size:25px;width:46px}
    .cell{font-size:23px;padding:0;height:100%;border-radius:3px}
    .cell[aria-pressed="true"]{transform:none}
    .specials{flex:none;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
    .cell.spec{padding:12px 0;font-size:14px}
    .cell.spec b{font-size:13px;margin-left:8px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }

  /* ---------- compact boards for 3 and 5 seats ---------- */
  .board.seats-3 .side,.board.seats-5 .side{padding:9px 12px;gap:7px}
  .board.seats-3 .side-total,.board.seats-5 .side-total{font-size:26px}
  .board.seats-5 .meta{display:none}
  .board.seats-5 .side-name{font-size:14px}

  /* ---------- partner + split ---------- */
  .chip.alone{border-style:dashed;font-style:italic}
  .chip[disabled]{opacity:.35;cursor:not-allowed}
  .chip[disabled]:hover{background:transparent}
  .split-row{margin-bottom:9px}
  .split-name{
    display:block;font-size:12px;color:rgba(239,233,220,.72);
    margin-bottom:6px;font-weight:500;
  }

  /* ---------- log: mixed-rule marker ---------- */
  .log-row.stale{background:rgba(184,145,47,.09)}
  .log-row.stale .n{color:var(--gold)}
  .log-row .what .amp{color:rgba(14,26,43,.45);font-weight:400}
  .log-row .what span em{font-style:normal;color:var(--gold)}

  /* ---------- dialog ---------- */
  .dlg-backdrop{
    position:fixed;inset:0;z-index:50;
    background:rgba(6,12,20,.72);
    display:flex;align-items:center;justify-content:center;
    padding:calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b));
  }
  .dlg-backdrop[hidden]{display:none}
  .dlg{
    background:var(--ink-2);border:1px solid var(--line-lt);border-radius:4px;
    max-width:400px;width:100%;padding:20px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  .dlg h3{
    font-family:var(--disp);font-weight:400;font-size:21px;margin:0 0 12px;
  }
  .dlg p{font-size:13.5px;line-height:1.5;margin:0 0 12px;color:rgba(239,233,220,.85)}
  .dlg p.dim{color:rgba(239,233,220,.45);font-size:12px;margin-bottom:0}
  .dlg b{font-weight:700}
  .rescore-table{
    background:rgba(14,26,43,.5);border-radius:3px;
    padding:4px 12px;margin:0 0 14px;
  }
  .rescore-line{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:8px 0;border-bottom:1px solid var(--line-lt);
    font-size:13px;
  }
  .rescore-line:last-child{border-bottom:0}
  .rescore-line span:last-child{font-family:var(--mono);font-size:12px;white-space:nowrap}
  .rescore-line i{font-style:normal;color:rgba(239,233,220,.45)}
  .rescore-line b{color:var(--gold);font-weight:600}
  .dlg-actions{display:flex;gap:8px;margin-top:18px}
  .dlg-actions button{
    flex:1;padding:14px 10px;border-radius:2px;font-size:13px;font-weight:600;
    cursor:pointer;border:1px solid var(--line-lt);
  }
  .dlg-ok{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  .dlg-ok.danger-solid{background:var(--red);color:var(--bone);border-color:var(--red)}
  .dlg-cancel{background:transparent;color:var(--bone)}
  .dlg-cancel:hover{background:rgba(239,233,220,.08)}
  .dlg-actions button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}

  /* LAST RULE ON PURPOSE.
     The bid table and the in-round view are swapped by toggling the hidden
     attribute from JS. Rules above set display on those same elements — .head,
     .sheet, and the landscape .round-wrap block — and a class selector ties with
     [hidden] on specificity, so whichever comes last wins. Keeping this at the
     end means hidden wins on source order, and !important covers anything more
     specific. Three landscape bugs have come from display beating hidden. */
  [hidden]{display:none!important}
</style>
</head>
<body>

<header class="mast">
  <div class="wrap">
    <div class="mast-row">
      <div class="logo">5<em>00</em></div>
      <div class="kicker">Bid table &amp; score sheet</div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="board" id="board"></section>
  <div id="banner"></div>

  <div class="head"><h2>The bid table</h2><div class="rule"></div><div class="note" id="bidNote">Avondale</div></div>
  <section class="sheet" id="bidSheet">
    <table class="bids" id="bidTable"></table>
    <div class="specials" id="specials"></div>
  </section>

  <div class="head"><h2>Record a hand</h2><div class="rule"></div></div>
  <section class="panel" id="record"></section>

  <div class="head" id="refHead"><h2>Card ranks</h2><div class="rule"></div></div>
  <section class="panel idle" id="reference"></section>

  <div class="head"><h2>Hands played</h2><div class="rule"></div><div class="note" id="handCount"></div></div>
  <section class="log" id="log"></section>

  <details class="rules">
    <summary>House rules &amp; setup</summary>
    <div id="rules"></div>
  </details>

  <p class="colophon">SCORES ARE SAVED ON THIS DEVICE</p>
</main>

<div class="dlg-backdrop" id="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="dlg">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div class="dlg-actions">
      <button class="dlg-cancel" id="dlgCancel">Cancel</button>
      <button class="dlg-ok" id="dlgOk">OK</button>
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
